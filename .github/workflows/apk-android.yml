# ============================================================
#  WinChat — GitHub Actions: сборка APK (Android 8+, Java 21)
#  Версия: 2.0.1.14
#  Пакет: org.wintozo.messenger
# ============================================================

name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode keystore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > android/app/keystore.jks
            echo "KEYSTORE_SAVED=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_SAVED=false" >> $GITHUB_ENV
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signed)
        if: env.KEYSTORE_SAVED == 'true'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wintozo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        if: env.KEYSTORE_SAVED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wintozo-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_SAVED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1.14
          name: WinChat v2.0.1.14
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            **WinChat v2.0.1.14**

            Android 8+ | org.wintozo.messenger
            Подписанный APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
