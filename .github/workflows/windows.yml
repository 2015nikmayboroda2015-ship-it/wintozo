# ============================================================
#  WinChat — GitHub Actions: сборка EXE (Windows 10 1809+, x64)
#  Версия: 2.0.1.14
#  Пакет: org.wintozo.messenger
# ============================================================

name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Генерируем build/icon.ico из Icon.png — electron-builder требует ICO для Windows
      - name: Generate Windows icon (.ico)
        run: npm run icons:win

      - name: Build production bundle
        run: npm run build

      - name: Build Electron EXE (portable)
        run: npx electron-builder --win --x64 --config.electronDist=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Артефакты из папки dist-electron
      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: wintozo-installer-exe
          path: dist-electron/*.exe
          retention-days: 30

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: wintozo-portable-exe
          path: dist-electron/win-unpacked/WinChat.exe
          if-no-files-found: ignore
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1.14-win
          name: WinChat v2.0.1.14 (Windows)
          files: |
            dist-electron/*.exe
          body: |
            **WinChat v2.0.1.14 для Windows**

            Windows 10 1809+ | x64
            Portable + Installer
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
