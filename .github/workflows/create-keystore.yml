name: Generate Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore my-release-key.jks \
            -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.NEW_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.NEW_KEYSTORE_PASSWORD }}" \
            -dname "CN=WinChat, OU=Dev, O=Wintozo, L=Kyiv, ST=Kyiv, C=UA"

      - name: Check keystore contents
        run: |
          keytool -list -v -keystore my-release-key.jks -storepass "${{ secrets.NEW_KEYSTORE_PASSWORD }}"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: my-release-key.jks
          retention-days: 7
