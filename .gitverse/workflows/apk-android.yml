name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode keystore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > keystore.jks
            echo "KEYSTORE_SAVED=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_SAVED=false" >> $GITHUB_ENV
            echo "::warning::ANDROID_KEYSTORE secret is not set — release APK will NOT be built"
          fi

      - name: Build release APK (signed)
        if: env.KEYSTORE_SAVED == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release APK
        if: env.KEYSTORE_SAVED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wintozo-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Заменить на официальное действие создания релиза GitVerse
      - name: Create GitVerse Release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_SAVED == 'true'
        uses: actions/create-release@v1
        with:
          api_key: ${{ secrets.GITVERSE_API_KEY }}
          title: WinChat v${{ steps.ver.outputs.version }}
          body: |
            **WinChat v${{ steps.ver.outputs.version }}**

            Android 8+ | org.wintozo.messenger

            Новое в 6.0.2:
            - Обновлённая OOBE и новые анимации (Material You)
            - OOBE теперь только в стиле Material You
            - Новый дизайн чатов WinChat You: пузыри, композер и список чатов
            - 15 палитр — Океан, Лагуна, Янтарь, Сакура, Космос и другие
            - Исправлены баги
          files: |
            android/app/build/outputs/apk/release/app-release.apk

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wintozo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30