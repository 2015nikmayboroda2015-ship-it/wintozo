name: Build WinChat You APK (Release)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build WinChat You (release)
    runs-on: ubuntu-latest
    env:
      VITE_APP_VARIANT: you
      APP_ID: org.winchat.you
      APP_NAME: WinChat You

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure app variant (Capacitor/Android)
        run: |
          node <<'NODE'
          const fs = require('fs');
          const capPath = 'capacitor.config.json';
          const cap = JSON.parse(fs.readFileSync(capPath, 'utf8'));
          cap.appId = process.env.APP_ID;
          cap.appName = process.env.APP_NAME;
          fs.writeFileSync(capPath, JSON.stringify(cap, null, 2) + '\n');

          const gradlePath = 'android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          gradle = gradle.replace(/applicationId\s+"[^"]+"/, `applicationId "${process.env.APP_ID}"`);
          fs.writeFileSync(gradlePath, gradle);

          const stringsPath = 'android/app/src/main/res/values/strings.xml';
          let strings = fs.readFileSync(stringsPath, 'utf8');
          strings = strings.replace(/<string name="app_name">.*?<\/string>/, `<string name="app_name">${process.env.APP_NAME}</string>`);
          strings = strings.replace(/<string name="title_activity_main">.*?<\/string>/, `<string name="title_activity_main">${process.env.APP_NAME}</string>`);
          strings = strings.replace(/<string name="package_name">.*?<\/string>/, `<string name="package_name">${process.env.APP_ID}</string>`);
          strings = strings.replace(/<string name="custom_url_scheme">.*?<\/string>/, `<string name="custom_url_scheme">${process.env.APP_ID}</string>`);
          fs.writeFileSync(stringsPath, strings);
          NODE

      - name: Build production bundle (You-only)
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK не найден — ставим command-line tools…"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            URL=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL -o /tmp/cmdline-tools.zip "$URL"
            else
              wget -qO /tmp/cmdline-tools.zip "$URL"
            fi
            rm -rf /tmp/cmdline-tools
            mkdir -p /tmp/cmdline-tools
            if command -v unzip >/dev/null 2>&1; then
              unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            elif command -v python3 >/dev/null 2>&1; then
              python3 -m zipfile -e /tmp/cmdline-tools.zip /tmp/cmdline-tools
            else
              (cd /tmp/cmdline-tools && jar xf /tmp/cmdline-tools.zip)
            fi
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # Gradle не устанавливаем отдельным action: в android/ уже есть
      # wrapper (gradle-8.11.1), он сам скачает нужную версию.
      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > keystore.jks

      - name: Build release APK (signed)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: winchat-you-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
