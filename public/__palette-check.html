<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>palette check</title>
    <style>
      body { font: 13px/1.4 monospace; padding: 20px; background: #111; color: #eee; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .card { padding: 12px; border-radius: 14px; }
      .bad { outline: 2px solid #ff4d4d; }
      .row { display: flex; justify-content: space-between; gap: 10px; }
    </style>
  </head>
  <body>
    <div id="summary"></div>
    <div class="grid" id="grid"></div>
    <script type="module">
      import { YOU_SEEDS } from "/src/lib/materialYou.ts";

      const hexToRgb = (hex) => {
        const h = hex.replace("#", "");
        return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
      };
      const lum = (hex) => {
        const [r, g, b] = hexToRgb(hex).map((v) => {
          const s = v / 255;
          return s <= 0.04045 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      };
      const ratio = (a, b) => {
        const l1 = lum(a);
        const l2 = lum(b);
        return ((Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05));
      };
      const mix = (a, b, pa) => {
        const A = hexToRgb(a);
        const B = hexToRgb(b);
        return (
          "#" +
          A.map((v, i) => Math.round(v * pa + B[i] * (1 - pa)).toString(16).padStart(2, "0")).join("")
        );
      };

      const checks = [];
      const grid = document.getElementById("grid");
      for (const s of YOU_SEEDS) {
        const sender = mix(s.primary, s.onSurface, 0.82);
        const outTime = mix(s.onSurfaceVariant, s.surface, 0.88);
        const rows = [
          ["onSurface / surface", ratio(s.onSurface, s.surface), 7],
          ["onSurfaceVariant / surface", ratio(s.onSurfaceVariant, s.surface), 4.5],
          ["onSurface / surfaceHigh", ratio(s.onSurface, s.surfaceHigh), 7],
          ["sender / surfaceHigh", ratio(sender, s.surfaceHigh), 3],
          ["outTime / surfaceHigh", ratio(outTime, s.surfaceHigh), 3],
          ["onPrimary / primary", ratio(s.onPrimary, s.primary), 4.5],
          ["onPrimaryContainer / container", ratio(s.onPrimaryContainer, s.primaryContainer), 4.5],
          ["onSecondaryContainer / container", ratio(s.onSecondaryContainer, s.secondaryContainer), 4.5],
          ["onTertiaryContainer / container", ratio(s.onTertiaryContainer, s.tertiaryContainer), 4.5],
        ];
        const card = document.createElement("div");
        card.className = "card" + (rows.some(([, r, min]) => r < min) ? " bad" : "");
        card.style.background = `linear-gradient(160deg, ${s.surfaceLow}, ${s.surface} 55%, ${s.surfaceHigh})`;
        card.style.color = s.onSurface;
        card.innerHTML =
          `<div style="font-weight:700;margin-bottom:6px">${s.name} <span style="opacity:.6">${s.id}</span></div>` +
          `<div style="display:flex;gap:5px;margin-bottom:8px">` +
          [s.primary, s.primaryStrong, s.secondary, s.tertiary, s.primaryContainer, s.surfaceHighest]
            .map((c) => `<span style="width:22px;height:22px;border-radius:7px;background:${c}"></span>`)
            .join("") +
          `</div>` +
          rows
            .map(
              ([label, r, min]) =>
                `<div class="row" style="color:${r < min ? "#ff5a5a" : s.onSurfaceVariant}"><span>${label}</span><span>${r.toFixed(2)}</span></div>`
            )
            .join("");
        grid.appendChild(card);
        for (const [label, r, min] of rows) {
          if (r < min) checks.push(`${s.id}: ${label} = ${r.toFixed(2)} < ${min}`);
        }
      }
      document.getElementById("summary").textContent =
        `${YOU_SEEDS.length} palettes, ${checks.length} problems\n` + checks.join("\n");
      window.__paletteCheck = { count: YOU_SEEDS.length, problems: checks, ids: YOU_SEEDS.map((s) => s.id) };
    </script>
  </body>
</html>
